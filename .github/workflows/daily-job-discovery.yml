name: Daily job discovery

on:
  schedule:
    - cron: "30 2,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test job discovery
        run: python -m unittest discover -s tests

      - name: Discover and record matching jobs
        run: python scripts/discover_jobs.py

      - name: Commit and push tracker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/daily-tracker.md jobs/.seen_jobs.json
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh daily job tracker"
          git push origin "HEAD:${GITHUB_REF_NAME}"
